<!doctype html><html><head><meta charset="utf-8"><title>RUIN type tiles</title>
<style>
body{background:#060607;color:#c8c8cc;font-family:"Space Grotesk",system-ui,sans-serif;margin:0;padding:24px;width:1180px}
h2{font-size:13px;letter-spacing:.2em;color:#fff;margin:26px 0 4px;font-weight:500}
p.d{font-size:11px;color:#77777d;margin:0 0 8px;max-width:1100px}
.pair{display:flex;gap:18px}
.lab{font-size:9px;letter-spacing:.2em;color:#55555b;margin-bottom:4px}
.box{width:538px;height:98px;background:#0d0d0f;border:1px solid #1d1d22;border-radius:3px;position:relative;overflow:hidden;box-sizing:border-box}
.t{cursor:pointer;color:#6a6a70;font-size:9px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.t svg path{stroke:#5a5a60;fill:none;stroke-width:1.3}
.t.on{color:var(--c)} .t.on svg path{stroke:var(--c);filter:drop-shadow(0 0 3px var(--c))}
.grp{font-size:8px;letter-spacing:.24em;color:#3e3e44}
/* A */
.A{display:grid;grid-template-columns:repeat(4,1fr);gap:0 10px;padding:8px 12px}
.A .col{display:flex;flex-direction:column;gap:3px}.A .t{justify-content:flex-start;gap:8px;height:16px;border-radius:2px;padding:0 4px}
.A .t.on{background:rgba(255,255,255,.04)}
/* B */
.B{display:flex;padding:10px 8px;gap:4px}.B .t{flex-direction:column;gap:6px;flex:1;border:1px solid #1a1a1f;border-radius:3px;height:76px}
.B .t.on{border-color:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 40%,transparent) inset}
/* C */
.C{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px}.C .t{gap:6px;border:1px solid #1a1a1f;border-radius:3px;height:40px}
.C .t.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
/* D */
.D{display:flex;padding:8px 12px;gap:18px;align-items:stretch}.D .col{display:flex;flex-direction:column;gap:6px}.D .row{display:flex;gap:4px}
.D .t{width:34px;height:34px;border:1px solid #1a1a1f;border-radius:50%}.D .t.on{border-color:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 50%,transparent)}
.D .name{margin-left:auto;align-self:center;text-align:right;font-size:16px;letter-spacing:.24em;color:var(--c);text-shadow:0 0 8px var(--c)}
.D .name small{display:block;font-size:9px;letter-spacing:.14em;color:#55555b;text-shadow:none;margin-top:4px}
/* E */
.E{display:flex}.E .big{width:150px;border-right:1px solid #1a1a1f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--c);font-size:12px;letter-spacing:.2em}
.E .big svg path{stroke:var(--c);fill:none;stroke-width:1.8;filter:drop-shadow(0 0 4px var(--c))}
.E .list{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:20px;gap:2px 8px;padding:8px 12px}.E .t{justify-content:flex-start;gap:7px}
/* F */
.F{padding:10px 14px}.F .scale{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.24em;color:#3e3e44;margin-bottom:6px}
.F .bar{height:2px;background:linear-gradient(90deg,#3a3a40,var(--c));margin-bottom:8px}
.F .row{display:flex;justify-content:space-between}.F .t{flex-direction:column;gap:5px;width:48px}
.F .t svg{transform:scale(1.15)}
</style></head><body>
<h2 style="margin-top:0">RUIN · TYPE TILES IN THE BOX ABOVE THE KNOBS · 6 OPTIONS</h2>
<p class="d">Each shown at real size (538 × 98) for a drive (DRIVE 2, fire) and a filter (FILTER 1, ice). Current choice lit; one click switches.</p>
<div id="out"></div>
<script>
const DR=[['WARM',['tape','tube','starved','amp']],['CLIP',['soft clip','hard clip','diode']],['BREAK',['wavefold','rectify']],['DIGITAL',['downsample']]];
const FI=['notch','peak','band','comb','phaser'];
const th=Math.tanh;
function dpath(type,W=22,H=12){const g=3,f=x=>{const u=g*x;switch(type){case'tape':return(u+.08)/Math.sqrt(1+(u+.08)**2);case'tube':return th(u+.2)-th(.2);case'amp':return th(1.6*u+.3)-th(.3);case'soft clip':{const v=Math.max(-1,Math.min(1,u/1.5));return 1.5*v-.5*v*v*v}case'hard clip':return Math.max(-1,Math.min(1,u/1.6));case'diode':return u>=0?th(u):.5*th(2*u);case'starved':return u>.08?th(u-.08):u<-.25?.7*th(u+.25):0;case'wavefold':return Math.sin(1.7*u);case'rectify':return 2*Math.abs(th(u))-1;default:return x}};
const N=44,ys=[];for(let i=0;i<=N;i++){let ph=i/N;if(type==='downsample')ph=Math.floor(ph*7)/7;ys.push(f(Math.sin(2*Math.PI*ph)))}const pk=Math.max(...ys.map(Math.abs))||1;return ys.map((y,i)=>`${i?'L':'M'}${(i/N*W).toFixed(1)} ${(H/2-y/pk*(H/2-1)).toFixed(1)}`).join('')}
function fpath(type,W=22,H=12){const N=60,pts=[];for(let i=0;i<=N;i++){const x=i/N,d=x-.5;let y;switch(type){case'notch':y=1-Math.exp(-(d*d)/.004);break;case'peak':y=1+1.2*Math.exp(-(d*d)/.008);break;case'band':y=.25+.75*Math.exp(-(d*d)/.02);break;case'comb':y=.55+.45*Math.cos(x*Math.PI*8);break;default:y=1-.8*Math.exp(-((x-.33)**2)/.003)-.8*Math.exp(-((x-.66)**2)/.003)}pts.push(y)}const lo=Math.min(...pts,0),hi=Math.max(...pts,1.2);return pts.map((y,i)=>`${i?'L':'M'}${(i/N*W).toFixed(1)} ${(H-1-(y-lo)/(hi-lo)*(H-2)).toFixed(1)}`).join('')}
const icon=(p,W=22,H=12)=>`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${p}"/></svg>`;
const tile=(name,p,on,cls='',W,H)=>`<div class="t ${on?'on':''} ${cls}">${icon(p,W,H)}<span>${name}</span></div>`;
const drives=DR.flatMap(g=>g[1]);
const opt={
A:{t:'A · THE MENU, LAID OPEN',d:'The dropdown as it is, but always open: the four columns with their group names, icon + name per row. Calm, readable, no learning.',
 dr:(s)=>`<div class="box A" style="--c:#ff5a1f">${DR.map(([g,ts])=>`<div class="col"><div class="grp">${g}</div>${ts.map(t=>tile(t,dpath(t),t===s)).join('')}</div>`).join('')}</div>`,
 fi:(s)=>`<div class="box A" style="--c:#3fb8ff"><div class="col"><div class="grp">CUT</div>${['notch','comb','phaser'].map(t=>tile(t,fpath(t),t===s)).join('')}</div><div class="col"><div class="grp">BOOST</div>${['peak','band'].map(t=>tile(t,fpath(t),t===s)).join('')}</div><div class="col"></div><div class="col"></div></div>`},
B:{t:'B · ONE ROW OF CARDS',d:'Every type a tall card in one row, picture on top, name under. Most visual; names get tight on drives (10 cards).',
 dr:(s)=>`<div class="box B" style="--c:#ff5a1f">${drives.map(t=>tile(t.replace(' clip',''),dpath(t,30,16),t===s,'',30,16)).join('')}</div>`,
 fi:(s)=>`<div class="box B" style="--c:#3fb8ff">${FI.map(t=>tile(t,fpath(t,40,18),t===s,'',40,18)).join('')}</div>`},
C:{t:'C · TWO ROWS OF BUTTONS',d:'A 5 × 2 grid of wide buttons, icon beside the name, the current one filled faintly. Like a drum machine\'s pads.',
 dr:(s)=>`<div class="box C" style="--c:#ff5a1f">${drives.map(t=>tile(t,dpath(t),t===s)).join('')}</div>`,
 fi:(s)=>`<div class="box C" style="--c:#3fb8ff;grid-template-rows:1fr;align-content:center">${FI.map(t=>`<div style="height:84px;display:flex">${tile(t,fpath(t,30,16),t===s,'',30,16).replace('class="t','style="flex:1;flex-direction:column;height:84px" class="t')}</div>`).join('')}</div>`},
D:{t:'D · ROUND PADS + BIG NAME',d:'Icon-only round pads grouped by family, and the chosen type written large on the right with what it does. Cleanest look; you read names only for the current one (hover shows the others).',
 dr:(s)=>`<div class="box D" style="--c:#ff5a1f">${DR.map(([g,ts])=>`<div class="col"><div class="grp">${g}</div><div class="row">${ts.map(t=>`<div class="t ${t===s?'on':''}">${icon(dpath(t))}</div>`).join('')}</div></div>`).join('')}<div class="name">${s.toUpperCase()}<small>LOPSIDED · EVEN HARMONICS</small></div></div>`,
 fi:(s)=>`<div class="box D" style="--c:#3fb8ff"><div class="col"><div class="grp">CUT</div><div class="row">${['notch','comb','phaser'].map(t=>`<div class="t ${t===s?'on':''}">${icon(fpath(t))}</div>`).join('')}</div></div><div class="col"><div class="grp">BOOST</div><div class="row">${['peak','band'].map(t=>`<div class="t ${t===s?'on':''}">${icon(fpath(t))}</div>`).join('')}</div></div><div class="name">${s.toUpperCase()}<small>A DIP THAT MOVES</small></div></div>`},
E:{t:'E · BIG PICTURE + LIST',d:'The chosen type drawn big on the left (its sine cycle / its curve), the others as a compact list on the right. Shows best what you picked.',
 dr:(s)=>`<div class="box E" style="--c:#ff5a1f"><div class="big">${icon(dpath(s,110,46),110,46)}${s.toUpperCase()}</div><div class="list">${drives.map(t=>tile(t,dpath(t),t===s)).join('')}</div></div>`,
 fi:(s)=>`<div class="box E" style="--c:#3fb8ff"><div class="big">${icon(fpath(s,110,46),110,46)}${s.toUpperCase()}</div><div class="list">${FI.map(t=>tile(t,fpath(t),t===s)).join('')}</div></div>`},
F:{t:'F · GENTLE → DESTROYED SCALE',d:'All types on one line from gentle to destroyed (a ramp in the box colour), so the order itself tells you how hard each one is. Filters run soft → sharp.',
 dr:(s)=>`<div class="box F" style="--c:#ff5a1f"><div class="scale"><span>GENTLE</span><span>DESTROYED</span></div><div class="bar"></div><div class="row">${drives.map(t=>tile(t.replace(' clip',''),dpath(t,26,14),t===s,'',26,14)).join('')}</div></div>`,
 fi:(s)=>`<div class="box F" style="--c:#3fb8ff"><div class="scale"><span>SOFT</span><span>SHARP</span></div><div class="bar"></div><div class="row" style="justify-content:space-around">${['band','peak','phaser','notch','comb'].map(t=>tile(t,fpath(t,30,14),t===s,'',30,14)).join('')}</div></div>`},
};
document.getElementById('out').innerHTML=Object.values(opt).map(o=>`<h2>${o.t}</h2><p class="d">${o.d}</p><div class="pair"><div><div class="lab">DRIVE</div>${o.dr('tube')}</div><div><div class="lab">FILTER</div>${o.fi('notch')}</div></div>`).join('');
</script></body></html>
