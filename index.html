<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Grimm</title>
    <link rel="icon" href="data:," />
    <!-- Inside the plugin window (served from juce.backend, JUCE's bridge injected): no start screen, ever. -->
    <script>if (window.__JUCE__ || location.hostname === 'juce.backend') document.documentElement.classList.add('in-plugin');</script>
    <style>html.in-plugin #start { display: none !important; }</style>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>

    <section id="synth-v2" class="v2-wrap" aria-label="Synth"></section>

    <main id="old-ui" class="layout old-ui hidden">
      <section class="side">
        <div class="card">
          <h2 id="patch-title">–</h2>
          <p id="patch-desc" class="desc"></p>
          <div id="patch-tags" class="tags"></div>
          <div class="row">
            <button id="copy" class="btn" title="Copy the current patch as JSON (to save into data/library)">Copy patch JSON</button>
            <button id="revert" class="btn" title="Discard edits and reload the library patch">Revert</button>
            <button id="panic" class="btn" title="Stop all sound">Panic</button>
          </div>
        </div>
        <div class="card">
          <canvas id="scope" width="560" height="140"></canvas>
          <canvas id="spectrum" width="560" height="140"></canvas>
        </div>
      </section>
      <section id="params" class="params"></section>
    </main>

    <div id="start" class="overlay">
      <button class="btn primary big">Click to start audio</button>
      <p>The Grimm runs fully offline in your browser.</p>
    </div>

    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
