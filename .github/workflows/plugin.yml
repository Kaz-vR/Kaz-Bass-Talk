# Builds the Low Talk VST3 for Windows on every push, validates it with
# pluginval, and uploads it as a downloadable artifact.
name: Plugin (Windows VST3)

on:
  push:
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S plugin -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target LowTalk_VST3 --parallel

      - name: Engine tests (MPE, host tempo)
        run: |
          cmake --build build --config Release --target lowtalk_engine_test
          build\Release\lowtalk_engine_test.exe

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval's exit code isn't reliable on Windows: judge by its own verdict line.
          .\pluginval\pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process "build\LowTalk_artefacts\Release\VST3\Low Talk.vst3" | Tee-Object -FilePath pluginval.log
          if (Select-String -Path pluginval.log -Pattern "FAILED" -Quiet) { exit 1 }
          if (-not (Select-String -Path pluginval.log -Pattern "^SUCCESS" -Quiet)) { exit 1 }
          exit 0

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: LowTalk-VST3-Windows
          path: build/LowTalk_artefacts/Release/VST3/
