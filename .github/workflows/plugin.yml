# Builds the Low Talk VST3 for Windows on every push, validates it with
# pluginval, and uploads it as a downloadable artifact.
name: Plugin (Windows VST3)

on:
  push:
    paths: ['plugin/**', 'src/**', 'data/**', 'tools/gen-plugin-data.ts', 'tools/lib/**', 'index.html', 'package*.json', 'vite.config.ts', '.github/workflows/plugin.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The plugin window is the web UI: build it, the plugin embeds dist/.
      - name: Build the web UI
        run: |
          npm ci
          npx vite build

      # The plugin's parameter list, Wobbler tables and presets, always from the shared data.
      - name: Generate the plugin data
        run: npx tsx tools/gen-plugin-data.ts

      # WebView2 (the window's browser), linked statically: the NuGet package's static loader.
      - name: Get the WebView2 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.1901.177 -OutFile webview2.zip
          Expand-Archive webview2.zip -DestinationPath nuget\Microsoft.Web.WebView2.1.0.1901.177

      - name: Configure
        shell: pwsh
        run: |
          $nuget = (Join-Path $env:GITHUB_WORKSPACE "nuget") -replace '\\', '/'
          cmake -S plugin -B build -A x64 "-DLOWTALK_FORMATS=VST3;Standalone" "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$nuget"

      - name: Build
        run: cmake --build build --config Release --target LowTalk_VST3 --parallel

      - name: Engine tests (MPE, host tempo)
        run: |
          cmake --build build --config Release --target lowtalk_engine_test
          build\Release\lowtalk_engine_test.exe

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval's exit code isn't reliable on Windows: judge by its own verdict line.
          .\pluginval\pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process "build\LowTalk_artefacts\Release\VST3\Low Talk.vst3" | Tee-Object -FilePath pluginval.log
          if (Select-String -Path pluginval.log -Pattern "FAILED" -Quiet) { exit 1 }
          if (-not (Select-String -Path pluginval.log -Pattern "^SUCCESS" -Quiet)) { exit 1 }
          exit 0

      - name: Build the standalone test app
        run: cmake --build build --config Release --target LowTalk_Standalone --parallel

      - name: Report what's in the plugin
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "build\LowTalk_artefacts\Release\VST3" | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          $dll = "build\LowTalk_artefacts\Release\VST3\Low Talk.vst3\Contents\x86_64-win\Low Talk.vst3"
          $dumpbin = Get-ChildItem -Recurse "C:\Program Files\Microsoft Visual Studio" -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          & $dumpbin.FullName /dependents /headers $dll | Select-String -Pattern "machine|\.dll" | Out-String -Width 300
          Get-Content "build\LowTalk_artefacts\Release\VST3\Low Talk.vst3\Contents\Resources\moduleinfo.json" -ErrorAction SilentlyContinue

      - name: Upload standalone test app
        uses: actions/upload-artifact@v7
        with:
          name: LowTalk-Standalone-Windows
          path: build/LowTalk_artefacts/Release/Standalone/

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: LowTalk-VST3-Windows
          path: build/LowTalk_artefacts/Release/VST3/
